[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tei-autotune"
version = "0.5.2"
description = "Find an efficient client operating point for a TEI embedding endpoint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TEI AutoTune contributors" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tei-autotune = "tei_autotune.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tei_autotune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
